name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Committed dist must match the source
        run: git diff --exit-code -- dist/ || (echo "dist/ is stale. Run npm run build and commit the result." && exit 1)
      - run: npm run check
